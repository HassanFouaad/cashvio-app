# Foundation builds and lifecycle contracts; not live providers, receipt
# authorization or production deployment evidence. Require this job via rulesets.
name: quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  foundations:
    name: foundations
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:9
      NEXT_PUBLIC_PORTAL_URL: http://127.0.0.1:9
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - run: node scripts/check-foundations.mjs
      - run: npm install --global yarn@1.22.22 --ignore-scripts --no-audit --no-fund
      - run: yarn install --frozen-lockfile --non-interactive
      - run: yarn verify:ci
